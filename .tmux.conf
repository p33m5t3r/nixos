# Rebind prefix from C-b to C-a
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable mouse mode
set -g mouse on

# Start new panes and windows in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Better color support
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Status bar position
set-option -g status-position bottom

# Nightfox theme - matches waybar / hyprland
set -as terminal-features ",*:RGB"

# Bar
set -g status-style "bg=#192330,fg=#cdcecf"
set -g status-left-length 30
set -g status-right ""
set -g status-right-length 0
set -g window-status-separator ""

# Session name - mauve pill (echoes the waybar workspace pill)
set -g status-left "#[fg=#957a94,bg=#192330]#[fg=#131a24,bg=#957a94,bold] #S #[fg=#957a94,bg=#192330]"

# Windows - active gets a raised pill, inactive recedes
set -g window-status-current-format "#[fg=#2b3b51,bg=#192330]#[fg=#cdcecf,bg=#2b3b51,bold] #I #W #[fg=#2b3b51,bg=#192330]"
set -g window-status-format "#[fg=#575860,bg=#192330] #I #W "
set -g window-status-activity-style "fg=#c94f6d,bold"
set -g window-status-bell-style "fg=#f4a261,bold"


# Pane borders
set -g pane-border-style "fg=#39506d"
set -g pane-active-border-style "fg=#39506d"

# Messages and modes
set -g message-style "bg=#2b3b51,fg=#cdcecf"
set -g message-command-style "bg=#2b3b51,fg=#cdcecf"
set -g mode-style "bg=#2b3b51,fg=#cdcecf"
set -g clock-mode-colour "#719cd6"


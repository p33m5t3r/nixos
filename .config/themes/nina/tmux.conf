# nina — tmux
#
# Sourced by ~/.tmux.conf when $THEME is "nina". The variable is set by
# ~/.config/hypr/theme-nina.lua, so the tmux server inherits it from the
# hyprland session; a server already running when the theme changed keeps the
# old colours until it exits.
#
# Only the theme block from ~/.tmux.conf is overridden here — bindings, mouse
# mode and indexing stay where they are.

set -as terminal-features ",*:RGB"

set -g status-style "bg=#ebe9e2,fg=#14140f"
set -g status-left-length 30
set -g status-right ""
set -g status-right-length 0
set -g window-status-separator ""

# session name — the one saturated block, matching waybar's clock
set -g status-left "#[fg=#fbfbfd,bg=#2b2bd8,bold] #S #[fg=#2b2bd8,bg=#ebe9e2] "

# active window is ink on paper; inactive simply recedes
set -g window-status-current-format "#[fg=#14140f,bg=#f6f2ee,bold] #I #W #[fg=#f6f2ee,bg=#ebe9e2]"
set -g window-status-format "#[fg=#908f8a,bg=#ebe9e2] #I #W "
set -g window-status-activity-style "fg=#9d2233,bold"
set -g window-status-bell-style "fg=#8a6212,bold"

# borders: hairline everywhere, accent on the pane you're in
set -g pane-border-style "fg=#d5d2c8"
set -g pane-active-border-style "fg=#2b2bd8"

set -g message-style "bg=#2b2bd8,fg=#fbfbfd"
set -g message-command-style "bg=#2b2bd8,fg=#fbfbfd"
set -g mode-style "bg=#d9d9f3,fg=#14140f"
set -g clock-mode-colour "#2b2bd8"

# nina — kitty
#
# Reached via KITTY_CONFIG_DIRECTORY, set in ~/.config/hypr/theme-nina.lua.
# That variable replaces the whole config directory rather than layering on top
# of ~/.config/kitty, so this file is self-contained: font and padding live here
# too, not just colours.
#
# Libertinus Mono ships Regular only; bold and italic are synthesised. It also
# has no Nerd Font glyphs, hence the symbol_map fallback below.

font_family      family="Libertinus Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.0

# nerd-font private use areas -> Iosevka, so prompt/statusline icons survive
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 Iosevka Nerd Font Mono

window_padding_width 2 2 0 2
cursor_shape block
cursor_blink_interval 0

background #f6f2ee
foreground #14140f
selection_background #d9d9f3
selection_foreground #14140f
url_color #2b2bd8
cursor #2b2bd8
cursor_text_color #f6f2ee

active_border_color   #2b2bd8
inactive_border_color #b7b6b0
bell_border_color     #9d2233

active_tab_background   #2b2bd8
active_tab_foreground   #f6f2ee
inactive_tab_background #e6e4dd
inactive_tab_foreground #908f8a

# normal
color0 #2a2a24
color1 #9d2233
color2 #2f6d43
color3 #8a6212
color4 #2b2bd8
color5 #6b3fd8
color6 #1c6f68
color7 #5a5a54

# bright
color8  #7a7a73
color9  #c03a4a
color10 #3f8a58
color11 #a8801e
color12 #4a4ae2
color13 #8558e4
color14 #2f8c84
color15 #14140f

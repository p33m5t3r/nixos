# nina — wofi
#
# Passed to wofi with -c from ~/.config/hypr/theme-nina.lua.
#
# Wider and shorter than the default: the serif face needs the horizontal room,
# and the mock shows a short result list rather than a long one.
width=480
lines=8
insensitive=true
hide_scroll=true
no_actions=true
prompt=/
dynamic_lines=true

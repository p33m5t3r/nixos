
set-window-option -g mode-keys vi

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

set-window-option -g automatic-rename on
set-option -g set-titles on

set -g mouse on
set -g base-index 1
set -g pane-base-index 1

# Claude Code support
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Cross-session status row: all sessions + windows, current window highlighted,
# Claude state colored from the @claude option (set by hooks in ~/.claude/settings.json)
set -g status on
set -g status-interval 2
set -g status-style 'bg=#1c1c1c,fg=#d0d0d0'
set -g status-format[0] '#(~/.tmux/claude-status.sh "#{client_session}")'
# Re-run the bar instantly on navigation (the 2s interval is just a fallback)
set-hook -g after-select-window 'refresh-client -S'
set-hook -g client-session-changed 'refresh-client -S'
set-hook -g session-window-changed 'refresh-client -S'
# Click a session/window cell in the bar to jump there
bind -n MouseDown1Status run-shell "~/.tmux/claude-click.sh '#{mouse_status_range}'"

# new panes n stuff spawn from current pane cwd
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
